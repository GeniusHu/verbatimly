name = "verbatimly"
main = "src/worker.js"
compatibility_date = "2026-11-10"

# 静态资源优先匹配，未命中路径落到 Worker（/api/*）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[[kv_namespaces]]
binding = "RATE"
id = "3787a5f071a745afa901dfcbec6d8aab"

# 自定义域：verbatimly.ai（Cloudflare Registrar 同账号 zone，自动建 DNS）
routes = [
  { pattern = "verbatimly.ai", custom_domain = true }
]

# Waffo 支付（非敏感项；私钥走 wrangler secret put WAFFO_PRIVATE_KEY）
[vars]
WAFFO_MERCHANT_ID = "MER_5PrQadKzkEx6aKArlSjLZe"
WAFFO_STORE_ID = "STO_34swoWpnn7rYI9aJfMEDS3"
WAFFO_PRODUCT_ID = "PROD_45dCNPdCpG8fcfDMuFP70L"
CREDITS_PER_PACK = "5"
