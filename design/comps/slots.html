<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>标题里那个"词" —— 三个方案</title>
<style>
  body{margin:0;background:#f6f5f2;color:#111;font:16px/1.6 -apple-system,"PingFang SC",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 24px 70px}
  h1{font-size:26px;margin:0 0 4px}
  .lead{color:#666;margin:0 0 30px;font-size:15px}
  section{margin:0 0 34px;background:#fff;border-radius:12px;overflow:hidden}
  .cap{padding:14px 20px 10px}
  .cap b{font-size:18px}
  .cap p{margin:4px 0 0;color:#666;font-size:14.5px}
  img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>标题里那个"词"，三个替换方案</h1>
  <p class="lead">都放在同一句标题里，方便直接比。上传区已按要求加高加大。</p>

  <section>
    <div class="cap"><b>A · 真实字幕条</b><p>时间码 + 一句真实字幕，直接嵌在 "Turn any video … into plain text" 中间。信息量最大。</p></div>
    <img src="../shots/slot-a.png" alt="A 真实字幕条">
  </section>

  <section>
    <div class="cap"><b>B · 波形 + 时间码 + 播放头</b><p>你要的加宽绿波浪，右侧带 00:14 时间码和播放头。像一条正在播放的音轨。</p></div>
    <img src="../shots/slot-b.png" alt="B 波形条">
  </section>

  <section>
    <div class="cap"><b>C · 微型转录窗口</b><p>两行小字 + 闪烁光标，像刚转录出来的实时窗口。</p></div>
    <img src="../shots/slot-c.png" alt="C 转录窗口">
  </section>
</div>
</body>
</html>
